<!DOCTYPE html>
<html lang="en" class="bg-baseCrimson-100">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play History</title>
    <meta name="description" content="Your play history">
    <link rel="icon" href="img/favicon.png">
    <link href="./output.css" rel="stylesheet">
</head>
<body class="w-full overflow-y-scroll no-scrollbar">
    <main class="main-page flex flex-col w-full mt-80px px-16px max-w-full sm:max-w-screen-sm md:max-w-screen-md lg:max-w-screen-lg xl:max-w-screen-xl mx-auto" id="main-page">
        <div class="site-notice bg-secondaryCrimson-32 text-baseCrimson-100 p-16px font-medium rounded-12px text-16px mb-24px">
            Note: This site is still in-development. Expect bugs.
        </div>
        <div class="index-area rounded-16px bg-white shadow-md p-4 mb-4 overflow-x-auto">
            <h2 class="text-24px font-semiBold text-primaryCrimson-100">Play History</h2>
            <div class="h-1 w-full rounded-16px bg-secondaryCrimson-12 mt-2 mb-4"></div>
            <table class="w-full whitespace-nowrap text-14px">
                <thead>
                    <tr class="text-primaryCrimson-100 text-16px font-bold">
                        <td class="py-8px px-12px">Song</td>
                        <td class="py-8px px-12px">Combo</td>
                        <td class="py-8px px-12px">Score</td>
                        <td class="py-8px px-12px">Accuracy</td>
                        <td class="py-8px px-12px">Mods</td>
                        <td class="py-8px px-12px">Time</td>
                    </tr>
                </thead>
                <tbody id="history-list" class="text-secondaryCrimson-100"></tbody>
            </table>
        </div>
    </main>

    <script src="js/lib/localforage.min.js"></script>
    <script src="js/ui/nav.js"></script>
    <script src="js/ui/loader.js"></script>
    <script src="js/ui/footer.js"></script>
    <script src="js/ui/layout.js"></script>
    <script>
        Weboss.Layout.init({ active: '' });

        Date.prototype.customFormat = function(fmt) {
            var YYYY = this.getFullYear(), YY = (YYYY + "").slice(-2);
            var M = this.getMonth() + 1, MM = M < 10 ? "0" + M : M;
            var MMMM = ["January","February","March","April","May","June","July","August","September","October","November","December"][M-1];
            var MMM = MMMM.substring(0,3);
            var D = this.getDate(), DD = D < 10 ? "0" + D : D;
            var DDDD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][this.getDay()];
            var DDD = DDDD.substring(0,3);
            var dMod = D % 10;
            var th = (D >= 10 && D <= 20) ? "th" : (dMod == 1 ? "st" : dMod == 2 ? "nd" : dMod == 3 ? "rd" : "th");
            fmt = fmt.replace("#YYYY#",YYYY).replace("#YY#",YY).replace("#MMMM#",MMMM).replace("#MMM#",MMM).replace("#MM#",MM).replace("#M#",M).replace("#DDDD#",DDDD).replace("#DDD#",DDD).replace("#DD#",DD).replace("#D#",D).replace("#th#",th);
            var hhh = this.getHours(), h = hhh;
            if (h == 0) h = 24;
            if (h > 12) h -= 12;
            var hh = h < 10 ? "0" + h : h;
            var hhhh = hhh < 10 ? "0" + hhh : hhh;
            var ampm = hhh < 12 ? "am" : "pm", AMPM = ampm.toUpperCase();
            var m = this.getMinutes(), mm = m < 10 ? "0" + m : m;
            var s = this.getSeconds(), ss = s < 10 ? "0" + s : s;
            return fmt.replace("#hhhh#",hhhh).replace("#hhh#",hhh).replace("#hh#",hh).replace("#h#",h).replace("#mm#",mm).replace("#m#",m).replace("#ss#",ss).replace("#s#",s).replace("#ampm#",ampm).replace("#AMPM#",AMPM);
        };

        var list = document.getElementById("history-list");
        function addEntry(summary) {
            var tr = document.createElement("tr");
            tr.className = "border-b border-secondaryCrimson-12";
            list.appendChild(tr);
            function td(content) {
                var t = document.createElement("td");
                t.className = "py-8px px-12px";
                tr.appendChild(t);
                if (content.tagName) t.appendChild(content);
                else t.innerText = content;
            }
            var title = document.createElement("a");
            title.innerText = summary.title + " [" + summary.version + "]";
            title.href = "search.html?q=" + (summary.sid || summary.title);
            title.className = "text-accentCrimson-100 hover:underline";
            td(title);
            td(summary.combo);
            td(summary.score);
            td(summary.grade);
            td(summary.mods);
            td(new Date(summary.time).customFormat("#D# #MMM# #hhhh#:#mm#"));
        }

        if (window.localforage) {
            localforage.getItem("playhistory1000", function(err, item) {
                if (!err && item && item.length) {
                    item = item.reverse();
                    for (var i = 0; i < item.length; ++i) addEntry(item[i]);
                }
            });
        } else {
            document.getElementById("history-list").innerHTML =
                '<tr><td colspan="6" class="py-16px text-center">localforage not supported in this browser.</td></tr>';
        }
    </script>
</body>
</html>
