<!DOCTYPE html>
<html lang="en" class="bg-baseCrimson-100">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap');
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Favorites</title>
    <meta name="description" content="Your favorited beatmaps">
    <link rel="icon" href="img/favicon.png">
    <link href="./output.css" rel="stylesheet">
</head>
<body class="w-full overflow-y-scroll no-scrollbar">
    <main class="main-page flex flex-col w-full mt-80px px-16px max-w-full sm:max-w-screen-sm md:max-w-screen-md lg:max-w-screen-lg xl:max-w-screen-xl mx-auto" id="main-page">
        <div class="site-notice bg-secondaryCrimson-32 text-baseCrimson-100 p-16px font-medium rounded-12px text-16px mb-24px">
            Note: This site is still in-development. Expect bugs.
        </div>
        <div class="index-area rounded-16px bg-white shadow-md p-4 mb-4">
            <h2 class="text-24px font-semiBold text-primaryCrimson-100">Favorited Beatmaps</h2>
            <div class="h-1 w-full rounded-16px bg-secondaryCrimson-12 mt-2 mb-4"></div>
            <div class="beatmap-list" id="beatmap-list"></div>
        </div>
    </main>

    <script src="js/launchgame.js"></script>
    <script src="js/downloader.js"></script>
    <script src="js/addbeatmaplist.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/jsloader.js"></script>
    <script src="js/lib/localforage.min.js"></script>
    <script src="js/ui/nav.js"></script>
    <script src="js/ui/loader.js"></script>
    <script src="js/ui/footer.js"></script>
    <script src="js/ui/layout.js"></script>
    <script>
        Weboss.Layout.init({ active: 'liked' });
        if (window.localforage) {
            window.localforage.getItem("likedsidset", function(err, val) {
                if (err) {
                    document.getElementById("beatmap-list").innerText = "Failed to load favorites.";
                    return;
                }
                if (val && val.size) {
                    var list = Array.from(val);
                    addBeatmapSids(list, document.getElementById("beatmap-list"));
                } else {
                    document.getElementById("beatmap-list").innerText =
                        "No favorites yet. Click the heart on any beatmap to save it.";
                }
            });
        } else {
            document.getElementById("beatmap-list").innerText = "localforage not supported in this browser.";
        }
    </script>
</body>
</html>
